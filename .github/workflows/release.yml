name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Periksa secret penandatanganan
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KS KP KA; do
            if [ -z "${!v}" ]; then echo "::error::Secret untuk $v belum diisi. Lihat docs/RELEASE.md"; exit 1; fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK & AAB rilis (bertanda tangan)
        env:
          ARSIPOS_KEYSTORE: ${{ runner.temp }}/release.jks
          ARSIPOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ARSIPOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ARSIPOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' && secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Verifikasi tanda tangan & ganti nama
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          VERSION=$(grep -m1 versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p dist
          cp "$APK" "dist/ArsipOS-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ArsipOS-v${VERSION}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: ArsipOS-release
          path: dist/*
          if-no-files-found: error

      - name: Publikasikan GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
